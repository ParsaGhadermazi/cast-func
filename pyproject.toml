[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "cast-func"
version = "0.3.0"
description = "Build live notebook-backed presentations from Python functions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "polars>=0.20",
    "plotly>=5.18",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "notebook>=7.0",
]

[project.optional-dependencies]
notebook = ["ipython>=8.0"]
dev = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/ParsaGhadermazi/cast-func"
Issues = "https://github.com/ParsaGhadermazi/cast-func/issues"

[tool.poetry]
packages = [{ include = "cast" }]
